name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  binaries:
    uses: ./.github/workflows/build-binaries.yml
    with:
      release: true

  upload:
    name: Attach release assets
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: flashrom-*
          merge-multiple: true
          path: dist
      - name: Create source archive and checksums, then upload
        shell: bash
        env:
          # GitHub CLI needs an explicit authentication token in Actions.
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cat VERSION)
          git archive --format=tar.gz --prefix="flashrom-${version}/" \
            -o "dist/flashrom-${version}-source.tar.gz" HEAD
          cd dist
          sha256sum -- * > SHA256SUMS
          gh release upload "$RELEASE_TAG" -- *
